name: One-off - rotate buyback
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = только проверить подписанта и баланс'
        type: choice
        options: ['true', 'false']
        default: 'true'
permissions:
  contents: read
jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - env:
          CIRCUIT_BUYBACK_MNEMONIC: ${{ secrets.CIRCUIT_BUYBACK_MNEMONIC }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node .github/scripts/rotate-buyback.mjs
