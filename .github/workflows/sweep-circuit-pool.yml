name: One-off - sweep old Circuit pool
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = только проверить подписанта и баланс'
        type: choice
        options: ['true', 'false']
        default: 'true'
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - env:
          OLD_MNEMONIC: ${{ secrets.OPERATOR_MNEMONIC_CIRCUIT }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node .github/scripts/sweep-circuit-pool.mjs
